<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 980" role="img" aria-labelledby="title desc">
  <title id="title">南方的窗</title>
  <desc id="desc">一扇拱形木窗，窗外下着细雨，远处是低矮的山。窗台上放着书、一杯热茶和一盆绿植。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfc9"/>
      <stop offset="0.48" stop-color="#d7d8c4"/>
      <stop offset="1" stop-color="#a9b8a4"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a523c"/>
      <stop offset="0.55" stop-color="#5d3f30"/>
      <stop offset="1" stop-color="#4a3227"/>
    </linearGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6047"/>
      <stop offset="1" stop-color="#5a3d2e"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa391"/>
      <stop offset="1" stop-color="#748a78"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#657c69"/>
      <stop offset="1" stop-color="#4c6454"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a5d"/>
      <stop offset="1" stop-color="#9f5f3d"/>
    </linearGradient>
    <clipPath id="windowClip">
      <path d="M134 790 V384 A266 266 0 0 1 666 384 V790 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- wall -->
  <rect width="800" height="980" fill="#f4efe4"/>
  <rect x="42" y="58" width="716" height="860" rx="8" fill="#efe6d5"/>
  <rect x="42" y="58" width="716" height="860" rx="8" fill="none" stroke="#d9cbb4" stroke-width="1.5"/>

  <!-- window frame -->
  <path d="M92 808 V374 A308 308 0 0 1 708 374 V808 Z" fill="url(#frame)"/>
  <path d="M134 790 V384 A266 266 0 0 1 666 384 V790 Z" fill="url(#sky)"/>

  <g clip-path="url(#windowClip)">
    <!-- moon -->
    <circle cx="545" cy="244" r="54" fill="#f3ddb2" opacity="0.62" filter="url(#soft)"/>
    <circle cx="545" cy="244" r="42" fill="#f6e4bd" opacity="0.9"/>

    <!-- far hills -->
    <path d="M90 610 C160 560 222 584 282 548 C345 510 404 566 470 542 C540 516 610 560 712 522 V800 H90 Z" fill="url(#hillFar)" opacity="0.68"/>
    <!-- near hills -->
    <path d="M70 664 C150 618 226 646 306 608 C382 572 456 630 538 604 C612 580 684 616 740 592 V810 H70 Z" fill="url(#hillNear)" opacity="0.92"/>

    <!-- distant rooftops -->
    <g fill="#425548" opacity="0.55">
      <rect x="216" y="674" width="84" height="52"/>
      <path d="M208 674 L258 640 L308 674 Z"/>
      <rect x="330" y="690" width="66" height="38"/>
      <path d="M323 690 L363 664 L403 690 Z"/>
      <rect x="556" y="668" width="78" height="46"/>
      <path d="M548 668 L595 638 L642 668 Z"/>
    </g>

    <!-- rain -->
    <g stroke="#f7f1e6" stroke-linecap="round" opacity="0.42">
      <path d="M172 146 L156 214" stroke-width="2"/>
      <path d="M224 118 L208 182" stroke-width="1.4"/>
      <path d="M286 172 L270 238" stroke-width="1.8"/>
      <path d="M338 112 L322 178" stroke-width="1.2"/>
      <path d="M390 156 L374 226" stroke-width="2"/>
      <path d="M452 108 L436 174" stroke-width="1.5"/>
      <path d="M508 164 L492 226" stroke-width="1.7"/>
      <path d="M600 126 L584 194" stroke-width="1.4"/>
      <path d="M642 196 L626 260" stroke-width="2"/>
      <path d="M200 280 L184 348" stroke-width="1.3"/>
      <path d="M300 300 L284 366" stroke-width="1.6"/>
      <path d="M420 278 L404 344" stroke-width="1.2"/>
      <path d="M548 310 L532 376" stroke-width="1.5"/>
      <path d="M628 338 L612 404" stroke-width="1.3"/>
      <path d="M250 420 L234 486" stroke-width="1.4"/>
      <path d="M474 420 L458 486" stroke-width="1.8"/>
      <path d="M590 452 L574 518" stroke-width="1.2"/>
      <path d="M194 526 L178 592" stroke-width="1.5"/>
      <path d="M390 512 L374 578" stroke-width="1.4"/>
      <path d="M660 528 L644 594" stroke-width="1.6"/>
    </g>

    <!-- window bars -->
    <rect x="392" y="110" width="16" height="690" fill="url(#frame)"/>
    <rect x="110" y="556" width="580" height="13" fill="url(#frame)"/>
    <rect x="110" y="304" width="580" height="9" fill="url(#frame)" opacity="0.5"/>
    <rect x="110" y="792" width="580" height="14" fill="url(#frame)"/>

    <!-- glass sheen -->
    <path d="M160 740 L420 200 L486 200 L226 780 Z" fill="#fffaf0" opacity="0.06"/>
  </g>

  <!-- sill -->
  <rect x="60" y="804" width="680" height="30" rx="3" fill="url(#sill)"/>
  <rect x="44" y="828" width="712" height="22" rx="3" fill="#4d3428"/>
  <rect x="60" y="846" width="680" height="10" fill="#3f2a21" opacity="0.65"/>

  <!-- books -->
  <g>
    <rect x="164" y="748" width="134" height="24" rx="2" fill="#b45f45"/>
    <rect x="170" y="772" width="148" height="20" rx="2" fill="#e0c9a5"/>
    <rect x="158" y="792" width="126" height="16" rx="2" fill="#62745f"/>
    <rect x="180" y="748" width="7" height="24" fill="#9d4e38" opacity="0.8"/>
    <rect x="214" y="748" width="3" height="24" fill="#f5e7d0" opacity="0.6"/>
    <rect x="188" y="772" width="4" height="20" fill="#c2a77e" opacity="0.8"/>
    <rect x="300" y="760" width="20" height="48" rx="2" fill="#c9a26d"/>
    <rect x="306" y="766" width="8" height="36" fill="#a77e49" opacity="0.7"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M556 752 C540 700 548 660 578 628" fill="none" stroke="#4f6b5d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M574 704 C604 678 626 686 636 704 C612 722 590 720 574 704 Z" fill="#5f7d68"/>
    <path d="M556 686 C526 660 508 672 502 690 C526 706 546 702 556 686 Z" fill="#6f8b74"/>
    <path d="M568 664 C588 634 612 634 626 648 C614 674 590 678 568 664 Z" fill="#4d6b58"/>
    <path d="M566 736 C542 726 524 736 518 750 C540 760 558 752 566 736 Z" fill="#78907b"/>
    <path d="M552 760 H636 L626 812 H562 Z" fill="#b87855"/>
    <rect x="548" y="750" width="92" height="18" rx="3" fill="#a86647"/>
  </g>

  <!-- tea -->
  <g>
    <ellipse cx="424" cy="806" rx="48" ry="8" fill="#3f2a21" opacity="0.28"/>
    <path d="M386 746 H458 L450 802 C448 812 438 818 422 818 C406 818 396 812 394 802 Z" fill="#f7efe0"/>
    <path d="M386 746 H458 L454 764 H390 Z" fill="#e7d5bb"/>
    <path d="M458 758 C480 754 486 766 482 780 C478 794 464 796 452 790" fill="none" stroke="#f7efe0" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="422" cy="748" rx="34" ry="6" fill="url(#tea)"/>
    <g stroke="#eee2cf" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M408 730 C400 716 416 708 408 694"/>
      <path d="M426 728 C418 714 434 704 426 690"/>
      <path d="M444 732 C436 718 452 710 444 696"/>
    </g>
  </g>

  <!-- light on sill -->
  <path d="M120 846 H300 L260 870 H90 Z" fill="#f2ddba" opacity="0.18"/>

  <!-- grain overlay -->
  <rect width="800" height="980" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:multiply"/>
</svg>
